[system]
compatible=rock-3b
# Initial SD-card boot test; A/B switching is not configured.
bootloader=noop

[keyring]
path=/usr/lib/rauc/keyring.pem

[slot.rootfs.0]
device=/dev/disk/by-partlabel/rootfsA
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partlabel/rootfsB
type=ext4
bootname=B

[system]
compatible=qemuarm64
# QEMU loads the kernel directly; boot selection is not exercised.
bootloader=noop

[keyring]
path=/usr/lib/rauc/keyring.pem

[slot.rootfs.0]
device=/dev/disk/by-partlabel/rootfsA
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partlabel/rootfsB
type=ext4
bootname=B
